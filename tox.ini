[tox]
envlist =
    py310-django{52}-drf{317,318,main},
    py311-django{52}-drf{317,318,main},
    py312-django{52,60}-drf{317,318,main},
    py313-django{52,60}-drf{317,318,main},
    py314-django{52,60}-drf{317,318,main},
    black,
    docs,
    lint

[testenv]
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    drf317: djangorestframework>=3.17,<3.18
    drf318: djangorestframework>=3.18,<3.19
    drfmain: https://github.com/encode/django-rest-framework/archive/main.zip
    -rrequirements/requirements-testing.txt
    -rrequirements/requirements-optionals.txt

setenv =
    PYTHONPATH = {toxinidir}
    DJANGO_SETTINGS_MODULE=example.settings.test

commands =
    pytest --cov --no-cov-on-fail --cov-report xml {posargs}

[testenv:black]
basepython = python3.12
deps =
    -rrequirements/requirements-codestyle.txt
commands = black --check .

[testenv:lint]
basepython = python3.12
deps =
    -rrequirements/requirements-codestyle.txt
    -rrequirements/requirements-testing.txt
    -rrequirements/requirements-optionals.txt
commands = flake8

[testenv:docs]
# keep in sync with .readthedocs.yml
basepython = python3.12
deps =
    -rrequirements/requirements-optionals.txt
    -rrequirements/requirements-documentation.txt
commands =
    sphinx-build -W -b html -d docs/_build/doctrees docs docs/_build/html
